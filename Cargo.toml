[package]
name = "vault-mirror"
version = "0.9.2"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Mirror and back up a Bitwarden or Vaultwarden vault, without the Bitwarden CLI."
repository = "https://github.com/NikitaMGrimm/vault-mirror"
readme = "README.md"
keywords = ["bitwarden", "vaultwarden", "backup", "mirror", "password-manager"]
categories = ["command-line-utilities", "cryptography"]
include = ["/src", "/LICENSE", "/README.md", "/CHANGELOG.md"]

# `cargo binstall vault-mirror` downloads the static release binary instead of
# compiling. Releases are built for musl, which also runs on glibc systems.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/vault-mirror-{ version }-{ target }.tar.gz"
bin-dir = "vault-mirror-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/vault-mirror-{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "vault-mirror-{ version }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/vault-mirror-{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "vault-mirror-{ version }-aarch64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/vault-mirror-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/vault-mirror-{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
base64 = "0.23.1"
bitwarden-crypto = "4.0.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
croner = "4.0.1"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4.3"
httpdate = "1.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream", "gzip", "form", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
uuid = { version = "1.28.0", features = ["v4"] }

# The crate handles master passwords; everything unsafe stays in audited
# dependencies.
[lints.rust]
unsafe_code = "forbid"

# Key derivation and RSA key generation are unusably slow without
# optimisation, and the test suite runs them constantly.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

