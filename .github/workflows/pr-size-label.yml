name: Pull request size label

# Labels a pull request with the size that "Pull request size" measured. It
# may write labels, so it never checks out the pull request. It reads only
# the measured result, which a pull request could forge, so it accepts
# nothing but a size label for the pull request whose commit was measured.
on:
  workflow_run:
    workflows: [Pull request size]
    types: [completed]

permissions: {}

jobs:
  label:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          MEASURED: ${{ github.event.workflow_run.head_sha }}
        run: |
          read -r pr size < size.txt
          if [[ ! "$pr" =~ ^[0-9]+$ || ! "$size" =~ ^size:[SML]$ ]]; then
            echo "::error::The measured result is not a pull request number and a size label."
            exit 1
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q .head.sha)" != "$MEASURED" ]]; then
            echo "Pull request #$pr is not at the measured commit, so a newer run labels it."
            exit 0
          fi
          for label in size:S size:M size:L; do
            if [[ "$label" != "$size" ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$pr/labels/$label" --silent 2>/dev/null || true
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=$size" --silent
