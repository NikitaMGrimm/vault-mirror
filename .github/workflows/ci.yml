name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its run. Runs on main all finish, so
# every merged commit is tested, including against Bitwarden's server.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BW_VERSION: "2026.9.1"

jobs:
  # Decides whether anything but documentation changed. The other jobs skip
  # themselves when nothing did; a skipped required check still counts as
  # passed, which a workflow-level `paths-ignore` would not allow.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a known base, such as on a manual run, everything runs.
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD | tee changed
          if grep -qvE '\.md$|^docs/|^assets/' changed; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain that builds the release image, so Dependabot updates both.
      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal -c clippy,rustfmt && rustup default "$toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python3 .github/scripts/test_release.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 -m unittest discover -s .github/scripts -p test_demo.py

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain that builds the release image, so Dependabot updates both.
      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal && rustup default "$toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The official CLI checks that backups import into Bitwarden's own client.
      - run: npm install --no-fund --no-audit --prefix "$RUNNER_TEMP/bw" "@bitwarden/cli@$BW_VERSION"
      - run: sandbox/up.sh
      - run: cargo test --locked
        env:
          VAULT_MIRROR_REQUIRE_SANDBOX: "1"
          VAULT_MIRROR_BW: ${{ runner.temp }}/bw/node_modules/.bin/bw
      - if: failure()
        run: docker compose -f sandbox/compose.yaml logs

  # The same suite against Bitwarden's own server, which differs from
  # Vaultwarden in what it shows and accepts.
  official:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VAULT_MIRROR_REQUIRE_SANDBOX: "1"
      OFFICIAL: http://127.0.0.1:18085
      OFFICIAL_TLS: https://127.0.0.1:18445
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal && rustup default "$toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          npm install --no-fund --no-audit --prefix "$RUNNER_TEMP/bw" "@bitwarden/cli@$BW_VERSION"
          echo "VAULT_MIRROR_BW=$RUNNER_TEMP/bw/node_modules/.bin/bw" >> "$GITHUB_ENV"
      - run: sandbox/up.sh --official
      - name: Bitwarden's server as the source
        run: VAULT_MIRROR_SANDBOX_SOURCE="$OFFICIAL" cargo test --locked --test mirror --test organization --test backup
      - name: Bitwarden's server as the destination
        if: ${{ !cancelled() }}
        run: |
          VAULT_MIRROR_SANDBOX_DEST="$OFFICIAL" VAULT_MIRROR_SANDBOX_DEST_TLS="$OFFICIAL_TLS" \
            cargo test --locked --test mirror --test organization --test backup
      - name: Bitwarden's server on both sides
        if: ${{ !cancelled() }}
        run: |
          VAULT_MIRROR_SANDBOX_SOURCE="$OFFICIAL" VAULT_MIRROR_SANDBOX_DEST="$OFFICIAL" \
            VAULT_MIRROR_SANDBOX_DEST_TLS="$OFFICIAL_TLS" \
            cargo test --locked --test mirror --test organization --test backup
      - if: failure()
        run: docker compose -f sandbox/compose.yaml --profile official logs

  # Dependency licences and RustSec advisories; see deny.toml.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked

  # The release has Windows binaries, so the code must build and pass its
  # tests there. The end-to-end tests skip themselves: the sandbox needs
  # Linux containers.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          # The Arm runner image comes without rustup.
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/$TARGET/rustup-init.exe"
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            rm rustup-init.exe
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
          fi
          toolchain=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal && rustup default "$toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vault-mirror:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm vault-mirror:ci --version

  # The one check the main branch requires, so jobs can change without
  # changing the ruleset. A skipped job, such as every job for a
  # documentation-only change, counts as passed.
  ci:
    if: always()
    needs: [changes, lint, test, official, deny, msrv, windows, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]
