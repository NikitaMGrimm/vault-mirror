name: Labels

# Creates the labels that templates and workflows apply, and keeps their
# colours and descriptions as written here. Labels made by hand stay.
on:
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Sync the labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=(
            "bug|d73a4a|Something doesn't work as documented."
            "dependencies|0366d6|Updates a dependency."
          )
          for entry in "${labels[@]}"; do
            IFS='|' read -r name color description <<< "$entry"
            gh label create "$name" --color "$color" --description "$description" --force
          done
