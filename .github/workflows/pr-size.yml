name: Pull request size

# Measures a pull request with .github/scripts/pr_size.py. This workflow
# runs the pull request's own code, so it has no write access, even for a
# pull request from a fork. "Pull request size label" applies the result.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          size=$(python3 -I .github/scripts/pr_size.py "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          mkdir size
          echo "$PR $size" > size/size.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size
          path: size/
          retention-days: 1
