name: Release-plz

# Keeps a release pull request open with the next version and its changelog,
# generated from Conventional Commits. Merging it publishes the crate to
# crates.io through trusted publishing, tags the version, creates the GitHub
# release and runs the release workflow for binaries and the image.
#
# The release waits until CI has passed on the merged commit. It can't start
# when CI finishes instead, because crates.io refuses trusted publishing from
# a workflow that a `workflow_run` event started.
#
# Off until the repository variable RELEASE_PLZ is `true`: crates.io trusted
# publishing can only be set up after the first version is published by hand.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Passes once CI's run for this push has passed. A manual run of CI or a
  # pull request's run doesn't count.
  tested:
    if: vars.RELEASE_PLZ == 'true'
    runs-on: ubuntu-24.04
    # CI's slowest job may take an hour.
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          while :; do
            state=$(gh run list --workflow ci.yml --event push --branch main --commit "$GITHUB_SHA" \
              --limit 1 --json headSha,status,conclusion \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::CI ended with ${state#completed } on $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 60
          done

  release:
    needs: tested
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.release.outputs.releases_created == 'true' && fromJSON(steps.release.outputs.releases)[0].tag || '' }}
    steps:
      # Without a `ref`, this checks out the pushed commit that CI passed,
      # even if main has moved on since. release-plz releases it only if it
      # squashed a release pull request (`release_always`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tested release commit
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::The checkout is not the commit that passed CI"
            exit 1
          fi
          read -r -a parents <<< "$(git show -s --format=%P HEAD)"
          if (( ${#parents[@]} > 1 )); then
            echo "::error::Squash-merge release pull requests so release-plz publishes the tested commit"
            exit 1
          fi
      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal && rustup default "$toolchain"
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - id: release
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # A tag created with the workflow token does not start other workflows, so
  # the release workflow is called directly.
  build:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  pull-request:
    if: vars.RELEASE_PLZ == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pull-request
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          toolchain=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$toolchain" --profile minimal && rustup default "$toolchain"
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
