name: Pull request

# Checks a pull request's title and description. It reads only the event
# payload and checks out nothing, so it is safe for forks.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  # Pull requests are squashed with their title as the commit message, and
  # release-plz writes the release notes from those, so this applies to
  # everyone.
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|ci|build|chore|refactor|test|style)(\([a-z0-9-]+\))?!?: [^ ]'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Title the pull request as a Conventional Commit, such as 'fix: keep archive state on edit'. See CONTRIBUTING.md."
            exit 1
          fi

  description:
    # Dependabot and release-plz write their own descriptions, and the
    # maintainer and collaborators decide their own.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Comments in the template do not count.
          body=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs')
          missing=()
          for section in Problem Change Verification; do
            grep -Eq "^## ${section}[[:space:]]*\$" <<< "$body" || missing+=("a '## $section' section")
          done
          grep -Eq 'Agent assistance:|^No AI assistance\.' <<< "$body" \
            || missing+=("the AI disclosure line: 'No AI assistance.' or the agent note from the template")
          if (( ${#missing[@]} )); then
            for item in "${missing[@]}"; do
              echo "::error::The description needs $item. See .github/pull_request_template.md."
            done
            exit 1
          fi
          echo "The description follows the template."
