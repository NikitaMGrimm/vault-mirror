name: Pull request

# Checks that a pull request description follows the template. It reads only
# the event payload and checks out nothing, so it is safe for forks.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  description:
    # Dependabot and release-plz write their own descriptions.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Comments in the template do not count.
          body=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs')
          missing=()
          for section in Problem Change Verification; do
            grep -Eq "^## $section[[:space:]]*\$" <<< "$body" || missing+=("a '## $section' section")
          done
          grep -Eq 'Agent assistance:|^No AI assistance\.' <<< "$body" \
            || missing+=("the AI disclosure line: 'No AI assistance.' or the agent note from the template")
          if (( ${#missing[@]} )); then
            for item in "${missing[@]}"; do
              echo "::error::The description needs $item. See .github/pull_request_template.md."
            done
            exit 1
          fi
          echo "The description follows the template."
