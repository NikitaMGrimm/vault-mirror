name: Proposal
description: Suggest a feature or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        vault-mirror aims to stay small. Pull requests for substantial changes are only accepted after the proposal is approved here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why vault-mirror makes it hard today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed change
      description: What vault-mirror should do instead, including any new settings.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you considered.
