# Checked in CI with `cargo deny check`.

[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
]

[advisories]
# Every RustSec advisory fails the check unless listed here with a reason.
ignore = [
  # The Marvin timing attack on RSA decryption needs an attacker who can time
  # many decryptions of ciphertexts they choose. vault-mirror decrypts a few
  # organization keys per run, locally. No fixed `rsa` release exists.
  { id = "RUSTSEC-2023-0071", reason = "not exploitable here; see comment" },
  # age's localization macros use basic-toml only at build time to read
  # dependency-owned manifests. No maintained upstream release replaces it.
  { id = "RUSTSEC-2026-0374", reason = "build-time localization parser; no vault input" },
  # age pulls in P-256 support, but backups use only typed X25519 and scrypt
  # identities. Keep this exception out of the RSA dependency path.
  { id = "RUSTSEC-2026-0387", reason = "age's P-256 code is unused; bans below keep vulnerable versions out of other dependency paths" },
]

[licenses]
# Licences compatible with distributing vault-mirror under GPL-3.0-only.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
  { name = "crypto-bigint", version = "<0.7.6", wrappers = ["elliptic-curve"], reason = "RUSTSEC-2026-0387: only age's unused P-256 path may use an unpatched version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
