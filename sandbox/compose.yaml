# Two disposable Vaultwarden servers for integration tests: a mirror source and
# a mirror destination. Data lives in tmpfs, so `down` discards everything.
#
# Start it with `sandbox/up.sh`, which first creates the test certificate the
# TLS proxy serves. The servers answer on plain HTTP (18091, 18092) and behind
# TLS (18443, 18444); the official Bitwarden CLI only talks to the latter.
# Keep Monero's default RPC and ZMQ ports, 18081 and 18082, free.
# `sandbox/up.sh --official` adds Bitwarden's own server on 18085 and, behind
# TLS, 18445.
name: vault-mirror-sandbox

x-vaultwarden: &vaultwarden
  image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
  tmpfs:
    - /data
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/alive"]
    interval: 1s
    timeout: 3s
    retries: 30

x-environment: &environment
  SIGNUPS_ALLOWED: "true"
  SIGNUPS_VERIFY: "false"
  INVITATIONS_ALLOWED: "true"
  ENABLE_WEBSOCKET: "false"
  LOG_LEVEL: "warn"
  # The suite creates many accounts and logs in constantly.
  LOGIN_RATELIMIT_MAX_BURST: "100000"
  LOGIN_RATELIMIT_SECONDS: "1"
  UNAUTHENTICATED_RATELIMIT_MAX_BURST: "100000"
  UNAUTHENTICATED_RATELIMIT_SECONDS: "1"

services:
  source:
    <<: *vaultwarden
    environment:
      <<: *environment
      DOMAIN: "http://127.0.0.1:18091"
    ports:
      - "127.0.0.1:18091:80"
  dest:
    <<: *vaultwarden
    environment:
      <<: *environment
      DOMAIN: "http://127.0.0.1:18092"
    ports:
      - "127.0.0.1:18092:80"
  tls:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/tls:ro
    ports:
      - "127.0.0.1:18443:18443"
      - "127.0.0.1:18444:18444"
      - "127.0.0.1:18445:18445"
    depends_on:
      - source
      - dest

  # Bitwarden's own server, on 18085. Opt-in because the image is large:
  # `sandbox/up.sh --official`. It is not connected to Bitwarden: the
  # installation id is a made-up local value and there is no installation
  # key, so nothing is sent to Bitwarden's push relay.
  official:
    image: ghcr.io/bitwarden/lite:2026.9.2@sha256:f42c5a256face5c59990d515e7d672ff4f029c6d03acb8f0cb0c5839cd27fe2a
    profiles: [official]
    environment:
      BW_DOMAIN: "127.0.0.1"
      BW_DB_PROVIDER: postgresql
      BW_DB_SERVER: official-db
      BW_DB_DATABASE: vault
      BW_DB_USERNAME: bitwarden
      BW_DB_PASSWORD: sandbox
      BW_INSTALLATION_ID: "5a4dbc0e-7d3e-4c41-9f0c-2b1d4e6a8f10"
      BW_INSTALLATION_KEY: ""
      BW_ENABLE_ICONS: "false"
      BW_ENABLE_NOTIFICATIONS: "false"
      # Attachment download links are built from this address.
      globalSettings__baseServiceUri__vault: "http://127.0.0.1:18085"
      # Shows bank accounts, driver's licences and passports in syncs.
      globalSettings__launchDarkly__flagValues__pm-32009-new-item-types: "true"
      # Attachments go to blob storage, as in Bitwarden's cloud. Azurite shares
      # this container's network, so 127.0.0.1:10000 reaches it both here and,
      # through the published port, from the tests. The key is Azurite's
      # well-known development key.
      globalSettings__attachment__connectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
    tmpfs:
      - /tmp
      - /etc/bitwarden
    ports:
      - "127.0.0.1:18085:8080"
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/alive"]
      interval: 2s
      timeout: 3s
      retries: 90
    depends_on:
      official-db:
        condition: service_healthy
  # Keeps blobs in memory. Restart it only together with `official`, which
  # remembers the containers it has created.
  official-blobs:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    profiles: [official]
    network_mode: "service:official"
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--inMemoryPersistence", "--skipApiVersionCheck"]
  official-db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [official]
    environment:
      POSTGRES_USER: bitwarden
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: vault
    # Postgres 18 keeps its data in a versioned directory below this one and
    # refuses to start with anything mounted at the old `.../data`.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bitwarden", "-d", "vault"]
      interval: 1s
      timeout: 3s
      retries: 30
